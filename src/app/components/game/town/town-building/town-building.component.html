@let buildingData = building();

<app-scene class="building" kind="building" [url]="buildingData.url ?? ''">
  <app-scene-mask kind="building" [artUrl]="buildingData.url ?? ''"/>
  @if (buildingData.buildingId !== undefined) {
    <h2 class="building__title">{{ 'map:buildings.' + TownBuildingID[buildingData.buildingId] | i18next }}</h2>
  }
  @for (npc of buildingData.npcs; track npc.id) {
    <app-npc-frame
      [npc]="npc"
      [shopId]="npcShops()[npc.id]"
      (openDialogue)="openDialogue($event)"
      (openShop)="openShop(npc.id, $event)"
    />
  }
  <!-- A Site's gate. -->
  <ng-content/>
</app-scene>
