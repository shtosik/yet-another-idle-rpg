<nav class="game-menu">
  <ul class="game-menu__tabs">
    @for (entry of tabs(); track entry.tab) {
      @let active = entry.tab === activeTab();
      <li>
        <button
          class="game-menu__tab"
          type="button"
          [class.game-menu__tab--active]="active"
          [class.game-menu__tab--locked]="!entry.unlocked"
          [attr.aria-disabled]="entry.unlocked ? null : 'true'"
          [attr.aria-current]="active ? 'page' : null"
          [attr.title]="entry.unlocked ? null : ('gameTabs.locked' | i18next)"
          (click)="select(entry)"
        >
          @if (!entry.unlocked) {
            <svg class="game-menu__lock" aria-hidden="true" fill="none" height="12" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" viewBox="0 0 24 24" width="12">
              <rect height="10" rx="2" width="14" x="5" y="11"/>
              <path d="M8 11V8a4 4 0 0 1 8 0v3"/>
            </svg>
          }
          {{ ('gameTabs.' + GameTab[entry.tab]) | i18next }}
          @if (!entry.unlocked) {
            <span class="game-menu__sr-only">({{ 'gameTabs.locked' | i18next }})</span>
          }
          @if (entry.unlocked && entry.badge) {
            <span class="game-menu__badge">{{ entry.badge }}</span>
          }
        </button>
      </li>
    }
  </ul>
</nav>
<app-player-hud class="game-menu__hud"/>
