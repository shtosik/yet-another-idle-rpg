<section class="equipment">
    @for (slot of equipmentArray(); track slot.name) {
        <app-slot>
            <app-equipment-slot
                (unequipItem)="unequipItem($event)"
                [item]="Items[slot.item?.id]"
                [slotName]="slot.name"
                [tier]="slot.item?.tier"
                [unequipBlocked]="!!slot.item && !playerStore.canUnequip(slot.name)"
            />
        </app-slot>
    }
</section>
