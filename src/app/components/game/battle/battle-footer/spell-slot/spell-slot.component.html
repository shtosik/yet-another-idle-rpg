<button
  type="button"
  class="spell"
  [class.spell--ready]="canCast()"
  [attr.aria-disabled]="!canCast()"
  [attr.aria-label]="accessibleLabel()"
  placement="top"
  tooltipClass="tooltip-override"
  [autoPlacement]="false"
  [class.spell--disabled]="(!canAfford() || !isKnown()) && !isActive()"
  [class.spell--active]="isActive()"
  [style]="{ 'background-image': spellData().url | url }"
  [style.--time-left]="cooldownSweepDeg() + 'deg'"
  [tooltipTemplate]="tooltip"
  (click)="handleCastSpell()"
>
  @if (secondsUntilReady()) {
    <span class="spell__counter">{{ secondsUntilReady() }}</span>
  }
  <span class="spell__cost" [class.spell__cost--low]="!canAfford()" aria-hidden="true">{{ manaCost() }}</span>
</button>

<ng-template #tooltip>
  <p class="spell-status">{{ statusText() }}</p>
  <app-spell-tooltip [spellId]="equippedSpell().spellId"/>
</ng-template>
