<div class="battle">
  <app-scene class="battle__scene" kind="zone" [url]="sceneUrl()">
    @if (isInCombat()) {
      <app-enemy/>
    }
    <app-damage-popup/>
  </app-scene>
  <app-battle-nav-bar/>
  <div class="battle-pane">
    @if (!isInCombat()) {
      <div class="battle-pane__waiting" role="status">
        <span class="battle-pane__waiting-marker" aria-hidden="true"></span>
        <span>{{ 'app:battle.nextEnemy' | i18next }}</span>
      </div>
    }
    <app-battle-side-buttons/>
    @if (dropsLostToast(); as message) {
      <div class="battle-pane__toast" role="status">{{ message }}</div>
    }
    @if (seedFoundToast(); as message) {
      <div class="battle-pane__toast battle-pane__toast--below" role="status">{{ message }}</div>
    }
  </div>
  <app-battle-footer/>
</div>
