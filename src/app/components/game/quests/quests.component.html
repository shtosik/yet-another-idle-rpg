<div class="panel__tabs" role="tablist" [attr.aria-label]="'quests:panel.label' | i18next">
  @for (entry of TABS; track entry) {
    @let selected = tab() === entry;
    <button
      #tabButton
      aria-controls="quest-panel-body"
      class="panel__tab"
      role="tab"
      type="button"
      [attr.aria-selected]="selected"
      [attr.id]="'quest-panel-tab-' + entry"
      [attr.tabindex]="selected ? 0 : -1"
      [class.panel__tab--active]="selected"
      (click)="selectTab(entry)"
      (keydown)="onTabKeydown($event)"
    >{{ ('quests:panel.' + entry) | i18next }}</button>
  }
</div>

<!-- Focusable itself: the Reputation tab has nothing focusable inside yet. -->
<div
  class="panel__body"
  id="quest-panel-body"
  role="tabpanel"
  tabindex="0"
  [attr.aria-labelledby]="'quest-panel-tab-' + tab()"
>
  @switch (tab()) {
    @case ('quests') {
      <app-quest-list/>
    }
    @case ('reputation') {
      <app-reputation/>
    }
  }
</div>
