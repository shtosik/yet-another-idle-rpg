name: Release
run-name: release ← staging (${{ inputs.bump }})

# Cuts a release: branches release/x.y.z from staging with the version bumped and the changelog dated
# (npm run release), then links the PR into main. The PR is opened by hand: a PR created with the workflow
# token would not trigger CI. See docs/deployment.md, Releases.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version part to bump (MAJOR.MINOR.PATCH)
        type: choice
        options: [minor, patch, major]
        default: minor

permissions:
  contents: write

jobs:
  cut:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/release.mjs "$BUMP"
        env:
          BUMP: ${{ inputs.bump }}
      - name: Push release branch
        run: |
          VERSION=$(node -p "require('./package.json').version")
          BRANCH="release/$VERSION"
          if git ls-remote --exit-code --heads origin "$BRANCH" > /dev/null; then
            echo "::error::$BRANCH already exists."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898208+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git commit -am "chore(release): $VERSION"
          git push origin "$BRANCH"
          echo "### $BRANCH is ready" >> "$GITHUB_STEP_SUMMARY"
          echo "[Open the PR into main]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/compare/main...$BRANCH?expand=1)" >> "$GITHUB_STEP_SUMMARY"
