name: CI

on:
  # Every base branch, so a stacked PR fails the check below instead of getting no CI.
  pull_request:
  # Commits pushed straight to staging skip PR CI; this catches them.
  push:
    branches: [staging]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check PR base
        if: github.event_name == 'pull_request' && github.base_ref != 'main' && github.base_ref != 'staging'
        run: |
          echo "::error::PR base is '$BASE_REF'. One feature, one PR into staging: plan steps are commits on one branch, no stacked PRs (docs/git-workflow.md). Retarget it with gh pr edit --base staging."
          exit 1
        env:
          BASE_REF: ${{ github.base_ref }}
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # A PR into main is a release: it comes from release/* or hotfix/* and bumps the version (docs/deployment.md).
      - name: Check release branch and version bump
        if: github.base_ref == 'main'
        run: |
          case "$HEAD_REF" in
            release/*|hotfix/*) ;;
            *) echo "::error::PRs into main come from release/* or hotfix/* branches, not '$HEAD_REF'."; exit 1 ;;
          esac
          git fetch --depth=1 origin main
          node scripts/release.mjs check-bump "$(git show origin/main:package.json | node -p 'JSON.parse(require("fs").readFileSync(0, "utf8")).version')"
        env:
          HEAD_REF: ${{ github.head_ref }}
      - run: npm run validate
      - run: npm run lint
      # Agent hook tests (.claude/hooks), plain Node.
      - run: npm run test:tools
      # Unit specs (*.spec.ts) in headless Chrome, which ubuntu-latest ships.
      - run: npm run test:ci
      # test:assets is left out: it needs the local matting model (krita/..., not in git).
      - run: npm run build
